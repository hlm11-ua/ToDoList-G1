<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="fragments :: head (titulo='Equipo')"></head>
<body>

<div class="container my-5">
    <div th:replace="fragments :: navbar"></div>

    <!-- Alertas de feedback (mensaje de éxito / error) -->
    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${!#strings.isEmpty(mensaje)}">
        <span th:text="${mensaje}"></span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${!#strings.isEmpty(error)}">
        <span th:text="${error}"></span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0" th:text="${equipo.nombre}">Nombre equipo</h2>
        <a th:href="@{/equipos}" class="btn btn-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Volver a equipos
        </a>
    </div>

    <!-- Sección para crear un nuevo tablero -->
    <form th:action="@{/equipos/{id}/tableros/crear(id=${equipo.id})}"
          method="post"
          class="mb-4">
        <div class="form-row align-items-center">
            <div class="col-md-5 col-sm-8 mb-2 mb-sm-0">
                <label for="nombreTablero" class="sr-only">Nombre del tablero</label>
                <input type="text"
                       id="nombreTablero"
                       name="nombre"
                       class="form-control form-control-sm"
                       placeholder="Nombre del nuevo tablero"
                       required>
            </div>
            <div class="col-md-auto col-sm-4">
                <button type="submit" class="btn btn-success btn-sm">
                    <i class="bi bi-plus-circle"></i> Crear Tablero
                </button>
            </div>
        </div>
    </form>

    <!-- Tabla de tableros del equipo -->
    <table class="table table-striped align-middle">
        <thead class="table-dark">
        <tr>
            <th scope="col">ID</th>
            <th scope="col">TABLERO</th>
            <th scope="col" th:if="${session.esAdmin}">ACCIONES</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tablero : ${tableros}">
            <td th:text="${tablero.id}">1</td>
            <td>
                <a th:href="@{/tableros/{id}(id=${tablero.id})}"
                   th:text="${tablero.nombre}">
                    Nombre tablero
                </a>
            </td>

            <!-- Controles de edición y borrado solo para administradores -->
            <td th:if="${session.esAdmin}">
                <div class="d-flex align-items-center">
                    <!-- Formulario inline para editar el nombre -->
                    <form th:action="@{/tableros/{id}/update(id=${tablero.id})}"
                          method="post"
                          class="form-inline mr-2">
                        <input type="text"
                               name="nombre"
                               th:value="${tablero.nombre}"
                               class="form-control form-control-sm mr-1"
                               style="max-width: 220px;"
                               required>
                        <button type="submit" class="btn btn-warning btn-sm">
                            Guardar
                        </button>
                    </form>

                    <!-- Formulario para borrar el tablero -->
                    <form th:action="@{/tableros/{id}/delete(id=${tablero.id})}"
                          method="post"
                          class="m-0"
                          onsubmit="return confirm('¿Seguro que deseas eliminar este tablero?');">
                        <button type="submit" class="btn btn-danger btn-sm">
                            Eliminar
                        </button>
                    </form>
                </div>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(tableros)}">
            <td th:colspan="${session.esAdmin == true ? 3 : 2}"
                class="text-muted text-center py-3">
                No hay tableros creados en este equipo.
            </td>
        </tr>
        </tbody>
    </table>

    <hr class="my-4">

    <!-- Sección de usuarios del equipo -->
    <div class="mb-4">
        <h4 class="mb-3">Usuarios del equipo</h4>
        <table class="table table-striped align-middle">
            <thead class="table-secondary">
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Nombre</th>
                <th scope="col">Email</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.id}">1</td>
                <td th:text="${usuario.nombre}">Nombre Ejemplo</td>
                <td th:text="${usuario.email}">ejemplo@email.com</td>
            </tr>
            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="3" class="text-muted text-center py-3">
                    Sin usuarios registrados en este equipo.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="fragments :: javascript"></div>
</body>
</html>
