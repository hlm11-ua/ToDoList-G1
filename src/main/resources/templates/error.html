<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="fragments :: head (titulo='Error')"></head>
<body>

<div class="container my-5">
    <div th:replace="fragments :: navbar"></div>

    <div class="row justify-content-center mt-5">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0">
                        <i class="bi bi-exclamation-triangle-fill mr-2"></i>
                        ¡Vaya! Algo no ha salido bien
                    </h4>
                    <span class="badge badge-light text-danger" th:text="'Error ' + ${status ?: 500}">Error 500</span>
                </div>

                <div class="card-body text-center py-4">
                    <!-- Mensaje amigable según el código de estado HTTP -->
                    <h5 class="card-title font-weight-bold mb-3" th:switch="${status}">
                        <span th:case="403">No tienes permisos para acceder a esta sección</span>
                        <span th:case="404">La página o recurso que buscas no existe</span>
                        <span th:case="400">La petición enviada no es válida</span>
                        <span th:case="*">Se ha producido un error inesperado en el servidor</span>
                    </h5>

                    <p class="card-text text-muted mb-4"
                       th:text="${message != null and !#strings.isEmpty(message) and message != 'No message available'}
                                ? ${message}
                                : 'Por favor, vuelve a intentarlo o regresa al inicio.'">
                        Descripción detallada del error.
                    </p>

                    <div class="d-flex justify-content-center">
                        <a href="javascript:history.back()" class="btn btn-outline-secondary mr-2">
                            <i class="bi bi-arrow-left"></i> Volver atrás
                        </a>
                        <a th:href="@{/login}" class="btn btn-primary">
                            <i class="bi bi-house-door"></i> Ir al inicio
                        </a>
                    </div>
                </div>

                <div class="card-footer text-muted small text-center bg-light" th:if="${path != null}">
                    Ruta solicitada: <code th:text="${path}">/ruta</code>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments :: javascript"></div>
</body>
</html>
